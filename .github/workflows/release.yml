name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single file
        run: >
          dotnet publish src/WinToolbox/WinToolbox.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o dist

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/WinToolbox.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinToolbox.exe" | Out-File -Encoding utf8 -NoNewline dist/WinToolbox.exe.sha256
          "SHA256=$hash" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinToolbox.exe
            dist/WinToolbox.exe.sha256
          body: |
            **WinToolbox ${{ github.ref_name }}**

            Single self-contained executable — no installer, no .NET runtime needed.
            Double-click it; Windows asks for administrator rights once, because changing
            services and machine-wide keys requires it.

            The binary is unsigned, so SmartScreen warns on first run.

            ```
            SHA256  ${{ env.SHA256 }}
            ```

            Verify with `certutil -hashfile WinToolbox.exe SHA256`.

            Every change is reversible: per-card undo, plus *Restore all* which replays the
            journal in `%ProgramData%\WinToolbox\backup.json`.
